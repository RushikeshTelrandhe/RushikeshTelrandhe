<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/><stop offset="0.5" stop-color="#0b1730"/><stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5aa9ff" stroke-opacity="0.08"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="600" cy="150" rx="420" ry="120" fill="url(#glow)"/>

  <!-- circuit lines -->
  <g fill="none" stroke="#5aa9ff" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M0 60H180L220 100H380"/><path d="M0 240H140L190 190H320"/>
    <path d="M1200 60H1020L980 100H820"/><path d="M1200 240H1060L1010 190H880"/>
    <path d="M380 100V40H470"/><path d="M820 100V40H730"/>
  </g>
  <g fill="#7cc4ff" filter="url(#blur)">
    <circle cx="380" cy="100" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="190" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="100" r="5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="190" r="5"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#7cc4ff">
    <circle cx="380" cy="100" r="3"/><circle cx="320" cy="190" r="3"/><circle cx="820" cy="100" r="3"/><circle cx="880" cy="190" r="3"/>
    <circle cx="470" cy="40" r="3"/><circle cx="730" cy="40" r="3"/>
  </g>

  <!-- cycling text (12s loop) -->
  <defs>
  <clipPath id="c0"><rect x="303" y="115" height="55" width="0"><animate attributeName="width" values="0;594;594;0;0" keyTimes="0;0.1;0.23;0.25;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c1"><rect x="358" y="115" height="55" width="0"><animate attributeName="width" values="0;0;484;484;0;0" keyTimes="0;0.25;0.35;0.48;0.5;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c2"><rect x="281" y="115" height="55" width="0"><animate attributeName="width" values="0;0;638;638;0;0" keyTimes="0;0.5;0.6;0.73;0.75;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="c3"><rect x="369" y="115" height="55" width="0"><animate attributeName="width" values="0;0;462;462;0" keyTimes="0;0.75;0.85;0.98;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
</defs>

<g font-family="Consolas,'Courier New',monospace" font-size="36" font-weight="700" fill="#ffffff">
  <text x="303" y="158" textLength="594" lengthAdjust="spacingAndGlyphs" clip-path="url(#c0)">Hi, I'm Rushikesh Telrandhe</text>
  <text x="358" y="158" textLength="484" lengthAdjust="spacingAndGlyphs" clip-path="url(#c1)">AI Engineering Student</text>
  <text x="281" y="158" textLength="638" lengthAdjust="spacingAndGlyphs" clip-path="url(#c2)">I build LLM &amp; Computer Vision</text>
  <text x="369" y="158" textLength="462" lengthAdjust="spacingAndGlyphs" clip-path="url(#c3)">Train · Ship · Deploy</text>
</g>

<!-- cursors -->
<g fill="#7cc4ff">
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="1;1;1;0;0" keyTimes="0;0.1;0.23;0.25;1" dur="16s" repeatCount="indefinite"/>
    <rect y="120" width="3" height="42"><animate attributeName="x" values="303;897;897;303;303" keyTimes="0;0.1;0.23;0.25;1" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;0;0" keyTimes="0;0.25;0.35;0.48;0.5;1" dur="16s" repeatCount="indefinite"/>
    <rect y="120" width="3" height="42"><animate attributeName="x" values="358;358;842;842;358;358" keyTimes="0;0.25;0.35;0.48;0.5;1" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;0;0" keyTimes="0;0.5;0.6;0.73;0.75;1" dur="16s" repeatCount="indefinite"/>
    <rect y="120" width="3" height="42"><animate attributeName="x" values="281;281;919;919;281;281" keyTimes="0;0.5;0.6;0.73;0.75;1" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect></g>
  <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;1;1;0" keyTimes="0;0.75;0.85;0.98;1" dur="16s" repeatCount="indefinite"/>
    <rect y="120" width="3" height="42"><animate attributeName="x" values="369;369;831;831;369" keyTimes="0;0.75;0.85;0.98;1" dur="16s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/></rect></g>
</g>
  <text x="600" y="205" text-anchor="middle" font-family="Consolas,monospace" font-size="18" fill="#7cc4ff" fill-opacity="0.8">YOLOv8 · PyTorch · FastAPI · Docker</text>
</svg>
